"memory_read": |-
  Search confirmed memories in the current server-bound workspace using a literal substring.
"memory_write": |-
  Propose a workspace preference or concern for exact user confirmation before it is saved.
"read_image": |-
  Read a PNG/JPEG/WebP/GIF file and return the image itself. Paths resolve relative to /workspace; admitted attachments use their exact /attachments path, including omitted images. Extension-less image paths are identified from their bytes. Large supported images are normalized before the next model request; use this directly instead of creating thumbnails just to inspect pixels. Requires the exact calling model to declare image input. Independent files may be read concurrently in small batches.
"read": |-
  Read a UTF-8 text file and return line-numbered content. Paths resolve relative to /workspace; admitted file attachments use their exact /attachments path. Offset is the 1-based first line, default 1. Limit defaults to 2000 lines. Results cap each line to 2000 UTF-16 characters and selected text to 50 KiB; use the reported offset to continue. Binary files require a dedicated reader.
"write": |-
  Create or fully replace a UTF-8 text file.
"edit": |-
  Edit an existing UTF-8 text file by replacing literal text. Read first; old_string must match exactly once unless replace_all is true.
"glob": |-
  Find files by glob in /workspace, including hidden and ignored files except VCS internals. Sorted by modification time; over 100 results are sampled across top-level entries.
"grep": |-
  Search file contents with a ripgrep regular expression in /workspace. Defaults to ignore and hidden-file rules; a positive include glob overrides those rules for matching files. Retains up to 250 matches with 2000-byte line previews.
"todo_write": |-
  Record and update the structured task list for current work. Send the ENTIRE list every call; it REPLACES the previous list. Add one todo per concrete step before multi-step work. Keep at most one task in_progress; while work remains, exactly one should be active. Mark tasks completed immediately. Skip the list for trivial single-step tasks. Statuses: pending, in_progress, completed.
"subagent": |-
  Delegate an independent read-only task to a subagent. Supply all relevant context in prompt; the child does not inherit conversation history or attachments. It uses the exact current model configuration and cannot delegate, modify data or ask the user. Waits for completion by default; set run_in_background=true to return its child_id and collect with wait_subagents. Parent stopping cancels unfinished children. Results include at most 2048 UTF-8 bytes of the final report, with explicit clipping; full reports remain in the child journal.
"wait_subagents": |-
  Wait for up to four children owned by this parent run. Return their outcomes or current status when timeout_seconds expires; timeout does not cancel them. Full reports remain in each child journal.
"cancel_subagent": |-
  Cancel a child owned by this parent run, drain its active execution, and return the persisted outcome.
"subagent_result": |-
  Read a completed child's full report in pages. Supply child_id owned by this parent run, a zero-based Unicode character offset and a limit up to 2048. Use next_offset until it is null. Refuses children without a persisted outcome.
"skill": |-
  Load the complete instructions of an available skill by its exact catalog name before acting on a task that names or matches it.
"skill_resource": |-
  Read one explicitly referenced UTF-8 resource using a relative path from the provider of an available skill. This does not execute scripts.
"list_mcp_resources": |-
  List resources on the named configured MCP server. Pass its returned cursor to continue.
"list_mcp_resource_templates": |-
  List parameterized resource URI templates on the named configured MCP server.
"read_mcp_resource": |-
  Read a listed resource URI or an expanded resource template from the named MCP server.
"ask_user_question": |-
  Ask the user a concise question when you need confirmation, a choice, or missing information before proceeding. Send one or more questions, each with a stable id echoed in the answer. Put a recommended option first and append (Recommended) to its label.
"exit_plan_mode": |-
  Use only in plan mode. Present your COMPLETE plan as Markdown, starting with a # heading that names it, for user review. On approval leave plan mode and carry out the plan from your next step. Feedback means keep planning, revise and present again.
"exit_plan_mode.plan": |-
  The complete plan as Markdown, starting with a # heading that names it.
"oge_find_regions": |-
  Resolve an administrative region name to OGE's code, level and full ancestor path. Supports Chinese and English, exact or substring matching, optional exact ancestor name, and offset pagination. Never guess codes from place names. Return all ambiguous candidates; ask the user to choose when the task context does not disambiguate. The complete upstream tree is cached for one hour and is not returned to the model.
"oge_search_images": |-
  Search OGE satellite imagery by acquisition interval and ONE WGS84 region: administrative code/level from oge_find_regions, a closed polygon ring, or a bounding box. Times use yyyy-MM-dd HH:mm:ss. Optional product_ids restrict numeric OGE product IDs; absent product_ids searches across products. Optional cloud enables a percentage range; null disables cloud filtering. Returns a durable candidate_set_id and up to 10 image records per page with explicit next_page. Numbers shown on the map are 1-based positions in this exact candidate set. Use oge_get_image_detail for full metadata. When the user needs to choose or view candidates, explicitly call map_present(target=candidates, reference_id=candidate_set_id); search itself never opens the map. Records intersect the region and may represent multiple processing levels of the same acquisition. Public endpoint; OGE login is not required.
"oge_get_image_detail": |-
  Read full metadata for one numeric imageId from oge_search_images. A nonexistent image is an explicit error even when the upstream business code is successful. The returned path is an internal OGE data path, not a download URL. Public endpoint; OGE login is not required.
"oge_get_image_preview": |-
  Fetch and return the PNG thumbnail for one OGE imageId as a durable, model-visible image. Requires the calling model to have image input enabled. The preview is not a full-resolution analysis product and has no georeferencing; do not treat its pixels as a map layer or invent a download URL. Public endpoint; OGE login is not required.
"oge_list_my_data": |-
  List the logged-in user's uploaded OGE data, with optional asset-name keywords and grid/vector/other type filtering. Returns up to 10 compact assets per page, explicit next_page, assetUuid and Personal:Asset references. Use oge_get_my_data_detail for full metadata. Login is managed in settings; missing or expired login is an explicit error. Do not request or pass passwords or tokens through tool arguments.
"oge_get_my_data_detail": |-
  Read full metadata for an assetUuid returned by oge_list_my_data, including bandStats when present and a Personal:Asset reference. Requires OGE login in settings. Numeric assetId and imagery imageId are not assetUuid. filePath and cogPath are internal storage paths, not download URLs. Use bandStats WGS84 fields for map positioning; upperLeftLong/Lat and lowerRightLong/Lat may instead be projected coordinates. Asset status alone does not confirm processing readiness. Missing assets and upstream failures are explicit errors.
"oge_search_operators": |-
  Search the live OGE operator catalog by name, alias or description. Use short keywords (for example NDVI, clip, Coverage). Returns catalog_total, matching total and bounded results; offset paginates matches. Catalog entries include helper functions and are not a promise that every entry is executable. Read the exact definition before writing code. Requires OGE login in settings.
"oge_get_operator_definition": |-
  Read the live definition, exact positional args, output type and optional sampleCode for one operator name returned by oge_search_operators. Do not invent operator names, parameter order or band names. Requires OGE login.
"oge_execute_code": |-
  Execute OGE Python SDK code through JWT executeCode compilation followed by a batch task submission. Compose multiple operators in one script and export exactly ONE Coverage; vector exports and multiple exports are explicit errors. This executes remotely, never on the user's computer. Requires approval and OGE login. Supply title, code, export crs (EPSG code) and scale (metres for projected CRS); obtain resolution/CRS from real imagery metadata or ask when needed. Optional display_range=[minimum,maximum] sets map colors without changing values. Use actual band names from metadata and operator definitions. Supply image_id with a real OGE image ID to load selected_image={coverageID,productID} from OGE metadata. No candidate-set binding is required. When image_id is omitted, the user's frozen map selection is loaded automatically; with no map selection, selected_image is null and the script must load its own inputs. Example SDK structure: import oge; oge.initialize(); service=oge.Service(); image=service.getCoverage(coverageID=selected_image["coverageID"],productID=selected_image["productID"]); image=service.getProcess("Coverage.toFloat").execute(image); result=service.getProcess("Coverage.NDVI").execute(image,"B4","B5"); result.export("analysis"). B4/B5 are only an example for matching Landsat imagery. Read definitions before executing. Never overwrite selected_image. When the user requests a particular image, use its actual image_id. Each invocation registers one session-owned background job and initially waits up to 120 seconds after submission. A still-running response contains the SAME job ID; use job_output to read/wait, never resubmit. Completion wakes the Agent through the existing jobs mechanism. Results include analysis_job_id and analysis_output_id. The downloaded GeoTIFF retains numeric values; scalar display colors are a separate preview. Use map_present(target=output,reference_id=analysis_output_id) to show it. Remote cancellation is not supported by the verified protocol.
"job_output": |-
  Read output from a background job owned by this session. Use the exact job.id returned by the producer or job_list. Returns only output since the preceding model read, current job status, and the terminal result once. Set wait=true only when blocked; timeout_ms defaults to 30000, maximum 600000. A wait deadline returns the current state (possibly running), never cancels the job or submits work again.
"job_list": |-
  List background jobs owned by this session with their IDs, kinds, labels and real statuses.
"job_kill": |-
  Request cancellation of a background job owned by this session. Returns cancellation-requested before it actually stops; already-finished for settled jobs. Some remote services explicitly refuse cancellation; do not claim they were cancelled.
"oge_download_preview": |-
  Return a prepared raster PNG through the existing model image receipt mechanism. Requires image input enabled for the calling model. A colored scalar preview is for visual interpretation; raw numerical values remain in the GeoTIFF.
"oge_download_result": |-
  Return the authenticated local download reference for the saved source GeoTIFF, preserving numeric bands. Large binary files are not inserted into model history.
"map_get_context": |-
  Read the calling session's persisted viewport, camera, selected_layer_id, image_selection, layer references and latest presentation receipt. Imagery and computed outputs share one layer stack and the same visibility, opacity and ordering controls. Read this when the user refers to map objects. image_selection.image_id can be supplied directly as image_id when executing OGE code; candidate-set binding is not required.
"map_present": |-
  Add session-owned imagery or a prepared output to the current session's shared map layer stack. target=candidates uses a candidate_set_id from oge_search_images and adds its images as temporary layers. Selecting one retains that image and removes the remaining temporary layers from the same search. When the user explicitly chooses an image (including by its 1-based number), pass its numeric image_id to record that choice; do not invent a choice. Re-presenting without image_id preserves the existing input selection. target=output uses an analysis_output_id from a completed job and adds its layer. open_map=true asks the UI to open the map; focus=true requests positioning using verified bounds. Returns the presentation request_id and its real receipt status. requested means requested, not confirmed rendered. Use map_get_context to inspect the later applied/failed receipt. Searching and finishing computation never navigate or display results automatically: call this tool when presentation is needed.
"map_set_layer_style": |-
  Update a session-owned layer's visibility, opacity and order with its current expected_revision. A conflict requires rereading map_get_context. This changes presentation only, not values or analysis parameters.
