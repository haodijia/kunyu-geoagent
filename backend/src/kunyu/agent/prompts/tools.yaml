"memory_read": |-
  Search confirmed memories in the current server-bound workspace using a literal substring.
"memory_write": |-
  Propose a workspace preference or concern for exact user confirmation before it is saved.
"read_image": |-
  Read a PNG/JPEG/WebP/GIF file and return the image itself. Paths resolve relative to /workspace; Chat attachments use their exact /workspace/attachments path and remain readable after context compaction, including omitted images. Extension-less image paths are identified from their bytes. Large supported images are normalized before the next model request; use this directly instead of creating thumbnails just to inspect pixels. Requires the exact calling model to declare image input. Independent files may be read concurrently in small batches.
"read": |-
  Read a UTF-8 text file and return line-numbered content. Paths resolve relative to /workspace; Chat attachments use their exact /workspace/attachments path and remain readable after context compaction. Offset is the 1-based first line, default 1. Limit defaults to 2000 lines. Results cap each line to 2000 UTF-16 characters and selected text to 50 KiB; use the reported offset to continue. Binary files require a dedicated reader.
"write": |-
  Create or fully replace a UTF-8 text file.
"edit": |-
  Edit an existing UTF-8 text file by replacing literal text. Read first; old_string must match exactly once unless replace_all is true.
"glob": |-
  Find files by glob in /workspace, including hidden and ignored files except VCS internals. Sorted by modification time; over 100 results are sampled across top-level entries.
"grep": |-
  Search file contents with a ripgrep regular expression in /workspace. Defaults to ignore and hidden-file rules; a positive include glob overrides those rules for matching files. Retains up to 250 matches with 2000-byte line previews.
"todo_write": |-
  Record and update the structured task list for current work. Send the ENTIRE list every call; it REPLACES the previous list. Add one todo per concrete step before multi-step work. Keep at most one task in_progress; while work remains, exactly one should be active. Mark tasks completed immediately. Skip the list for trivial single-step tasks. Statuses: pending, in_progress, completed.
"subagent": |-
  Delegate an independent read-only task to a subagent. Supply all relevant context in prompt; the child does not inherit conversation history or attachments. It uses the exact current model configuration and cannot delegate, modify data or ask the user. Waits for completion by default; set run_in_background=true to return its child_id and collect with wait_subagents. Parent stopping cancels unfinished children. Results include at most 2048 UTF-8 bytes of the final report, with explicit clipping; full reports remain in the child journal.
"wait_subagents": |-
  Wait for up to four children owned by this parent run. Return their outcomes or current status when timeout_seconds expires; timeout does not cancel them. Full reports remain in each child journal.
"cancel_subagent": |-
  Cancel a child owned by this parent run, drain its active execution, and return the persisted outcome.
"subagent_result": |-
  Read a completed child's full report in pages. Supply child_id owned by this parent run, a zero-based Unicode character offset and a limit up to 2048. Use next_offset until it is null. Refuses children without a persisted outcome.
"skill": |-
  Load the complete instructions of an available skill by its exact catalog name before acting on a task that names or matches it.
"skill_resource": |-
  Read one explicitly referenced UTF-8 resource using a relative path from the provider of an available skill. This does not execute scripts.
"list_mcp_resources": |-
  List resources on the named configured MCP server. Pass its returned cursor to continue.
"list_mcp_resource_templates": |-
  List parameterized resource URI templates on the named configured MCP server.
"read_mcp_resource": |-
  Read a listed resource URI or an expanded resource template from the named MCP server.
"ask_user_question": |-
  Ask the user a concise question when you need confirmation, a choice, or missing information before proceeding. Send one or more questions, each with a stable id echoed in the answer. Put a recommended option first and append (Recommended) to its label.
"exit_plan_mode": |-
  Use only in plan mode. Present your COMPLETE plan as Markdown, starting with a # heading that names it, for user review. On approval leave plan mode and carry out the plan from your next step. Feedback means keep planning, revise and present again.
"exit_plan_mode.plan": |-
  The complete plan as Markdown, starting with a # heading that names it.
"oge_find_regions": |-
  Find administrative regions by a Chinese or English name, optionally restricted to an exact ancestor name. Name matching uses substrings. Returns a list containing only code, level, name, name_en and path for each match, without pagination or search metadata. Never guess codes from place names. Ask the user to choose when the task context does not disambiguate multiple matches. The complete upstream tree is cached for one hour and is not returned to the model.
"oge_search_images": |-
  Search OGE satellite imagery by acquisition interval and ONE WGS84 region: administrative code/level from oge_find_regions, a closed polygon ring, or a bounding box. Times use yyyy-MM-dd HH:mm:ss. Optional product_ids restrict numeric OGE product IDs; absent product_ids searches across products. Optional cloud enables a percentage range; null disables cloud filtering. Page size is fixed at 100. Returns only page, next_page and images; next_page is null on the last page. Use oge_get_image_detail for full metadata. To show images on the map, explicitly call map_present(target=images, image_ids=[imageId, ...]); search itself never opens the map. Records intersect the region and may represent multiple processing levels of the same acquisition. Public endpoint; OGE login is not required.
"oge_get_image_detail": |-
  Read full metadata for one numeric imageId from oge_search_images. A nonexistent image is an explicit error even when the upstream business code is successful. The returned path is an internal OGE data path, not a download URL. Public endpoint; OGE login is not required.
"oge_get_image_preview": |-
  Fetch the PNG thumbnail for one OGE imageId. Returns the preview image itself and file_path for the saved local preview. Requires the calling model to have image input enabled. The preview is not a full-resolution analysis product and has no georeferencing; do not treat its pixels as a map layer or invent a download URL. This tool does not add map layers. Public endpoint; OGE login is not required.
"oge_list_my_data": |-
  List the logged-in user's uploaded OGE data, with optional asset-name keywords and grid/vector/other type filtering. Page size is fixed at 100. Returns only page, next_page and assets; next_page is null on the last page. Each asset includes assetUuid and a Personal:Asset reference. Use oge_get_my_data_detail for full metadata. Login is managed in settings; missing or expired login is an explicit error. Do not request or pass passwords or tokens through tool arguments.
"oge_get_my_data_detail": |-
  Read full metadata for an assetUuid returned by oge_list_my_data, including bandStats when present and a Personal:Asset reference. Requires OGE login in settings. Numeric assetId and imagery imageId are not assetUuid. filePath and cogPath are internal storage paths, not download URLs. Use bandStats WGS84 fields for map positioning; upperLeftLong/Lat and lowerRightLong/Lat may instead be projected coordinates. Asset status alone does not confirm processing readiness. Missing assets and upstream failures are explicit errors.
"oge_search_operators": |-
  Search or list the live OGE operator catalog. Both query and limit are optional: omit query to list the entire catalog; omit limit to return every match. Query words match case-insensitive substrings across name, alias, Chinese/English description and catalog name; every word must match. Exact names rank first, then names sort alphabetically. Use short keywords (for example NDVI, clip, Coverage). Returns only operators, with name, alias, catalogName and description for each entry. Catalog entries include helper functions and are not a promise that every entry is executable. Read the exact definition before writing code. Requires OGE login in settings.
"oge_get_operator_definition": |-
  Read live definitions for a list of operator names returned by oge_search_operators. Supply names as a nonempty list of unique names, including for a single operator. Returns operators in input order; each entry contains the definition with exact positional args, output type and optional sampleCode, or name and error with code/message. Individual lookup failures retain other successful definitions. Do not invent operator names, parameter order or band names. Requires OGE login; a shared authentication failure before lookup fails the tool call.
"oge_execute_code": |-
  Execute OGE Python SDK code through JWT executeCode compilation followed by a batch task submission. Input fields are title, code, export crs (EPSG code) and scale (metres for projected CRS). Write complete code that explicitly loads its inputs; no input variables or code prelude are injected. For OGE imagery, read oge_get_image_detail and use the verified imageIdentification and productName in service.getCoverage(coverageID=...,productID=...). Use real band names and operator definitions. Obtain resolution/CRS from metadata or ask when needed. Compose multiple operators and export exactly ONE Coverage; vector exports and multiple exports are explicit errors. Code executes remotely, never on the user's computer, and requires approval and OGE login. Each invocation registers one persistent session-owned job before authentication, compilation or submission, then waits up to 120 seconds from registration. A still-running response contains the SAME job ID; use job_output to read/wait, never resubmit. Completion wakes the Agent through the existing jobs mechanism. Use job.id as the sole public task ID. Successful result contains analysis_output_id and output paths; failed jobs retain stage and structured error with code/message plus a full log file_path, including after app restart. Raw GeoTIFF values are retained; previews and map tiles use automatic display stretching. Use map_present(target=output,reference_id=analysis_output_id) to show a prepared output. Map browsing does not specify computation inputs. Remote cancellation is not supported by the verified protocol.
"job_output": |-
  Read output from a background job owned by this session. Use the exact job.id returned by the producer or job_list. Returns output since the preceding model read, current job status/stage/error and the terminal result once inline. The full log file_path and completed result_file_path remain readable with file tools after restart; failed jobs remain queryable. Set wait=true only when blocked; timeout_ms defaults to 30000, maximum 600000. A wait deadline returns the current state (possibly running), never cancels the job or submits work again.
"job_list": |-
  List persistent background jobs owned by this session with their canonical IDs, kinds, labels, statuses, stages, structured errors and log paths, including failed jobs from earlier app runs.
"job_kill": |-
  Request cancellation of a background job owned by this session. Returns cancellation-requested before it actually stops; already-finished for settled jobs. Some remote services explicitly refuse cancellation; do not claim they were cancelled.
"oge_download_preview": |-
  Return a prepared raster PNG through the existing model image receipt mechanism. Requires image input enabled for the calling model. A colored scalar preview is for visual interpretation; raw numerical values remain in the GeoTIFF.
"oge_download_result": |-
  Return the authenticated local download reference for the saved source GeoTIFF, preserving numeric bands. Large binary files are not inserted into model history.
"map_get_context": |-
  Read the calling run's submitted viewport snapshot and the session's durable layer stack. The interactive camera, focus and highlighted layer are client-local UI preferences, not live server state or implicit computation inputs. Imagery and computed outputs share the same visibility, opacity and ordering controls. Use an explicit resource ID from the user's @ reference or verified metadata for computation.
"map_present": |-
  Add imagery or a prepared output to the session's shared layer stack. target=images requires image_ids, a list of numeric imageId values from this session's search results; repeated image IDs reuse existing layers. Adding images does not remove other layers or change computation inputs. target=output requires reference_id, an analysis_output_id from a completed job. Supply only the identifier field for the chosen target. open_map=true requests opening the map; focus=true requests positioning with verified bounds. Success confirms the layer mutation and returns the presentation request. It does not confirm client rendering; there is no separate rendering receipt. Searching and finishing computation do not add layers automatically.
"map_set_layer_style": |-
  Update a session-owned layer's visibility, opacity and order with its current expected_revision. A conflict requires rereading map_get_context. This changes presentation only, not values or analysis parameters.
