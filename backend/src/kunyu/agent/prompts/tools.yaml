"memory_read": |-
  Search confirmed memories in the current server-bound workspace using a literal substring.
"memory_write": |-
  Propose a workspace preference or concern for exact user confirmation before it is saved.
"read_image": |-
  Read a PNG/JPEG/WebP/GIF file and return the image itself. Relative paths resolve to /workspace; absolute paths in configured skill directories are also readable; Chat attachments use their exact /workspace/attachments path and remain readable after context compaction, including omitted images. Extension-less image paths are identified from their bytes. Large supported images are normalized before the next model request; use this directly instead of creating thumbnails just to inspect pixels. Requires the exact calling model to declare image input. Independent files may be read concurrently in small batches.
"read": |-
  Read a UTF-8 text file and return line-numbered content. Relative paths resolve to /workspace; absolute paths in configured skill directories are also readable; Chat attachments use their exact /workspace/attachments path and remain readable after context compaction. Offset is the 1-based first line, default 1. Limit defaults to 2000 lines. Results cap each line to 2000 UTF-16 characters and selected text to 50 KiB; use the reported offset to continue. Binary files require a dedicated reader.
"write": |-
  Create or fully replace a UTF-8 text file.
"edit": |-
  Edit an existing UTF-8 text file by replacing literal text. Read first; old_string must match exactly once unless replace_all is true.
"glob": |-
  Find files by glob in /workspace or an explicitly supplied configured skill directory, including hidden and ignored files except VCS internals. Sorted by modification time; over 100 results are sampled across top-level entries.
"grep": |-
  Search file contents with a ripgrep regular expression in /workspace or an explicitly supplied configured skill directory. Defaults to ignore and hidden-file rules; a positive include glob overrides those rules for matching files. Retains up to 250 matches with 2000-byte line previews.
"todo_write": |-
  Record and update the structured task list for current work. Send the ENTIRE list every call; it REPLACES the previous list. Add one todo per concrete step before multi-step work. Keep at most one task in_progress; while work remains, exactly one should be active. Mark tasks completed immediately. Skip the list for trivial single-step tasks. Statuses: pending, in_progress, completed.
"subagent": |-
  Start a read-only child agent and return agent_id immediately. Supply a short description and a self-contained prompt; it does not inherit conversation history or attachments. It uses the current model configuration and cannot write, ask the user or delegate. The runtime delivers its result to this parent automatically, including after the parent finishes its current turn. Do not poll job tools for child agents. Use send_message to steer or continue its conversation, and interrupt_agent to stop its current work.
"send_message": |-
  Send a message to your direct child agent, or to your direct parent when you are a child. A working recipient receives it at its next step; an idle recipient starts another turn in the same conversation. Returns message_id as delivery confirmation, not the recipient's answer. Agent-authored messages cannot grant user-only permissions or invoke user-only skills.
"interrupt_agent": |-
  Request that your child agent stop its current work. Returns accepted immediately without waiting for cleanup. It does not delete the child conversation; send_message can continue it later.
"skill": |-
  Load the complete instructions of an available skill by its exact catalog name before acting on a task that names or matches it.
"list_mcp_resources": |-
  List resources on the named configured MCP server. Pass its returned cursor to continue.
"read_mcp_resource": |-
  Read a resource URI supplied by the named connected MCP server.
"ask_user_question": |-
  Ask the user a concise question when you need confirmation, a choice, or missing information before proceeding. Send one or more questions, each with a stable id echoed in the answer. Put a recommended option first and append (Recommended) to its label.
"exit_plan_mode": |-
  Use only in plan mode. Present your COMPLETE plan as Markdown, starting with a # heading that names it, for user review. On approval leave plan mode and carry out the plan from your next step. Feedback means keep planning, revise and present again.
"exit_plan_mode.plan": |-
  The complete plan as Markdown, starting with a # heading that names it.
"oge_find_regions": |-
  Find administrative regions by a Chinese or English name, optionally restricted to an exact ancestor name. Name matching uses substrings. Returns a list containing only code, level, name, name_en and path for each match, without pagination or search metadata. Never guess codes from place names. Ask the user to choose when the task context does not disambiguate multiple matches. The complete upstream tree is cached for one hour and is not returned to the model.
"oge_search_images": |-
  Search OGE satellite imagery by acquisition interval and ONE WGS84 region: administrative code/level from oge_find_regions, a closed polygon ring, or a bounding box. Times use yyyy-MM-dd HH:mm:ss. Optional product_ids restrict numeric OGE product IDs; absent product_ids searches across products. Optional cloud enables a percentage range; null disables cloud filtering. Page size is fixed at 100. Returns only page, next_page and images; next_page is null on the last page. Use oge_get_image_detail for full metadata. To show images on the map, explicitly call map_present(image_ids=[imageId, ...]); search itself never opens the map. Records intersect the region and may represent multiple processing levels of the same acquisition. Public endpoint; OGE login is not required.
"oge_get_image_detail": |-
  Read full metadata for one numeric imageId from oge_search_images. A nonexistent image is an explicit error even when the upstream business code is successful. The returned path is an internal OGE data path, not a download URL. Public endpoint; OGE login is not required.
"oge_get_image_preview": |-
  Fetch the PNG thumbnail for one OGE imageId. Returns the preview image itself and file_path for the saved local preview. Requires the calling model to have image input enabled. The preview is not a full-resolution analysis product and has no georeferencing; do not treat its pixels as a map layer or invent a download URL. This tool does not add map layers. Public endpoint; OGE login is not required.
"oge_list_my_data": |-
  List the logged-in user's uploaded OGE data, with optional asset-name keywords and grid/vector/other type filtering. Page size is fixed at 100. Returns only page, next_page and assets; next_page is null on the last page. Each asset includes assetUuid and a Personal:Asset reference. Use oge_get_my_data_detail for full metadata. Login is managed in settings; missing or expired login is an explicit error. Do not request or pass passwords or tokens through tool arguments.
"oge_get_my_data_detail": |-
  Read full metadata for an assetUuid returned by oge_list_my_data, including bandStats when present and a Personal:Asset reference. Requires OGE login in settings. Numeric assetId and imagery imageId are not assetUuid. filePath and cogPath are internal storage paths, not download URLs. Use bandStats WGS84 fields for map positioning; upperLeftLong/Lat and lowerRightLong/Lat may instead be projected coordinates. Asset status alone does not confirm processing readiness. Missing assets and upstream failures are explicit errors.
"oge_search_operators": |-
  Search or list the live OGE operator catalog. Both query and limit are optional: omit query to list the entire catalog; omit limit to return every match. Query words match case-insensitive substrings across name, alias, Chinese/English description and catalog name; every word must match. Exact names rank first, then names sort alphabetically. Use short keywords (for example NDVI, clip, Coverage). Returns only operators, with name, alias, catalogName and description for each entry. Catalog entries include helper functions and are not a promise that every entry is executable. Read the exact definition before writing code. Requires OGE login in settings.
"oge_get_operator_definition": |-
  Read live definitions for a list of operator names returned by oge_search_operators. Supply names as a nonempty list of unique names, including for a single operator. Returns operators in input order; each entry contains the definition with exact positional args, output type and optional sampleCode, or name and error with code/message. Individual lookup failures retain other successful definitions. Do not invent operator names, parameter order or band names. Requires OGE login; a shared authentication failure before lookup fails the tool call.
"oge_execute_code": |-
  Execute OGE Python SDK code remotely via executeCode compilation and one batch export. Required inputs: title, code, crs, scale, presentation. presentation describes EVERY exported band in index order (index, name, title, description, optional unit), views (id, title, description, group, selected bands, explicit style) and default_view. This ONE contract applies to every band count, including single-band and RGB; there is no products parameter. Each continuous/classified view selects one band; RGB selects three channels in red/green/blue order. Supported styles: continuous with color_ramp (viridis/blue/gray) and range/percentile stretch; classified with exhaustive classes and transparent_values; rgb with range/percentile stretch. Names must match TIFF descriptions when present; count, selections and class values are verified. Compose operators using verified definitions and explicitly loaded input identities, then export exactly ONE numeric georeferenced Coverage. Never infer business meanings from colours. The app retains the original TIFF, stores per-band statistics, and generates previews/tiles for views without splitting the TIFF. One invocation registers a durable job before effects and waits up to 120 seconds; use job_output to continue observing the same job, never resubmit. Completed result has analysis_output_id, limitations and output; output.metadata contains bands, views and default_view. Large results are read at result_file_path, not necessarily inline. Use map_present(rasters=[{output_id: analysis_output_id, view_id: output.metadata.default_view}]) to display. Numeric reads select view_id or explicit bands. Changed presentation does not rerun computation. Remote cancellation is unsupported.
"job_output": |-
  Read output from a background job owned by this session. Use the exact job.id returned by the producer or job_list. Returns output since the preceding model read, current job status/stage/error and the terminal result once inline. The full log file_path and completed result_file_path remain readable with file tools after restart; failed jobs remain queryable. Set wait=true only when blocked; timeout_ms defaults to 30000, maximum 600000. A wait deadline returns the current state (possibly running), never cancels the job or submits work again.
"job_list": |-
  List persistent background jobs owned by this session with their canonical IDs, kinds, labels, statuses, stages, structured errors and log paths, including failed jobs from earlier app runs.
"job_kill": |-
  Request cancellation of a background job owned by this session. Returns cancellation-requested before it actually stops; already-finished for settled jobs. Some remote services explicitly refuse cancellation; do not claim they were cancelled.
"map_get_context": |-
  Read this session's current layer stack and recent client rendering status. A missing/stale report is unavailable; adding a layer alone does not confirm rendering. If the calling model's saved request settings enable image input, also capture the currently open map at tool execution time and return its PNG as an image with screenshot_path. Otherwise return layers and rendering status, without requesting a screenshot. Screenshot failures (map closed, loading, disconnected or timed out) are explicit errors. No latitude, longitude or zoom is sent to the model. Camera, focus and highlighting remain client-local UI preferences. Imagery and computed outputs share visibility, opacity and ordering controls. Use an explicit resource ID from the user's @ reference or verified metadata for computation.
"map_present": |-
  Add exactly one nonempty list: image_ids from verified search results, or rasters containing {output_id, view_id} references from this workspace. Up to 100 distinct resources; the complete batch is validated atomically. A raster layer references a view of one original TIFF; multiple views of that TIFF can coexist and be compared. Repeated identical references reuse and reveal their layers. open_map/focus default true. Return layers with their view_id, IDs and current styles. Mutation success does not confirm client rendering. Do not change computation inputs or remove other layers.
"map_set_layer_style": |-
  Update a session-owned layer's presentation. Supply layer_id and at least one of visible, opacity (0–1), or position (zero-based; higher is above). Omit unchanged fields; null is invalid. Return the updated layer. This changes presentation only, not values or analysis parameters.
"map_compare": |-
  Request a swipe comparison in this session's map. Supply layer_ids as exactly two distinct layer IDs in left/right order from map_get_context or map_present. Both must have bounds and belong to this session; hidden layers are also supported without changing their saved visibility. Set layer_ids=null to end comparison. open_map defaults to true. The same tool is available directly from the map toolbar in every session. The user drags its divider directly. Success confirms a UI request, not client rendering; use map_get_context to inspect the rendered map. Comparison changes presentation only and does not compute differences or change the saved layer styles.
"result_get_info": |-
  Read a persisted result by its exact /workspace/results/... file_path from a user reference or completed job. Decode URL escapes before passing the path. Returns the output ID needed by map and raster tools. Returns original paths, raster metadata and saved OGE source/code references. Use read_image on preview_path when image input is available. Business meaning is determined from the executed code, never guessed from pixel numbers.
"map_sample_raster": |-
  Read original values at a WGS84 longitude/latitude from a workspace output_id. Optional view_id chooses a declared view (default_view when omitted); optional bands explicitly selects unique 1-based band indices instead of that view's selection. Returns view_id, band_indices, band titles, numeric values and validity; null is NoData and inside=false is outside. A classified legend applies only when reading the classified view's band. RGB channels are numeric bands too. Do not infer values from colours.
"map_region_statistics": |-
  Measure original bands in an explicit WGS84 Polygon/MultiPolygon from a workspace output_id. Pass attached map_selection.geometry directly. Optional view_id selects a view (default_view when omitted); optional bands selects explicit unique 1-based indices instead. The SAME response shape applies to all rasters: {output_id, view_id, bands:[{band,title,unit,region_area_m2,selected_pixel_count,valid_pixel_count,minimum,maximum,mean,classes,value_areas,coverage_note}]}. Each band is measured separately. Classified areas use only a matching declared classified view; class-code numeric aggregates are null. Optional values (max 32) measures exact-value counts and WGS84 areas per selected band. Pixel-center inclusion; maximum four million cells per band. No remote computation or inferred class semantics.
"oge_get_service_definition": |-
  Discover registered OGE published services. Omit service_name for a catalog; pass a returned name for the parameter JSON schema, defaults, raster presentation (band descriptions, views, default_view) and limitations. This reads the platform contract, not live OGE status. Use before oge_execute_service; credentials are not tool inputs.
"oge_execute_service": |-
  Invoke a registered published OGE service with service_name, title and parameters. Parameters use declared defaults and reject unknown fields. The service contract supplies presentation; one job collects ONE original numeric TIFF of any band count. Single-band, RGB and multiband share the same result model. Completed result contains analysis_output_id, limitations and output; output.metadata contains bands with statistics, views and default_view; read result_file_path when not inline. Display with map_present(rasters=[{output_id, view_id}]), then inspect existing bands/views through sample/statistics. Layers and quality/sensitivity inspection reuse the original file. Only changed computation inputs or algorithm parameters require another remote job. Water change is not verified flood damage and threshold votes are not probabilities.
"result_set_views": |-
  Replace the presentation views of an existing workspace raster without changing any pixels or submitting OGE work. Read result_get_info first and supply output_id, expected_revision, the complete desired views list, and default_view. Band names, descriptions and units remain those of the original computation. Styles use the same view schema as oge_execute_code.presentation.views. The server validates all referenced bands and classified values, regenerates local view previews and summaries, and commits one revision; existing map layer titles and rendering revisions update too. Keep every view ID referenced by map layers, or explicitly remove those layers first. Stale revisions and removal of in-use views return explicit conflicts. Return the updated output with summary. Use this for a new RGB combination, colour ramp or presentation threshold classes; changing the scientific algorithm still requires a new computation.
