"skill_catalog": |-
  <system-reminder>
  This is the complete current skill catalog and replaces earlier catalogs. Skills are task instructions, not executable tools. When a task names or clearly matches a skill, call skill with its exact name before following it. A directly invoked skill already supplies its full <skill_content> instructions; follow them without calling skill again for that skill. Read referenced resources only as needed, using their supplied location and the normal file or resource tools.
  <available_skills>
  {{entries}}
  </available_skills>
  </system-reminder>
"skill_catalog_empty": |-
  <system-reminder>
  No skills are currently available for model invocation. This replaces earlier skill catalogs; do not call skill using earlier entries. A skill explicitly invoked by the user supplies its instructions directly.
  </system-reminder>
"permission_read_only": |-
  当前文件工具权限：read-only。当前会话只能读取，不能通过工具写入或修改文件。
"permission_workspace_write": |-
  当前文件工具权限：workspace-write。当前请求提供的写入和编辑工具可操作 /workspace/files；/workspace/attachments、/workspace/results 和 .cache 只读。
"approval_required": |-
  当前审批规则：需要确认的工具必须获得用户确认后才能执行；其他工具仍受当前权限约束。
"approval_denied": |-
  当前工具执行审批规则：只读或计划模式下，写入及需要执行审批的工具操作会被拒绝。不要自行扩大权限；提问和计划审阅使用独立的交互工具。
"subagent_delegation": |-
  你是受委派的只读子 Agent。权限在创建时确定，不能在此会话中扩大；不能写入、请求用户输入或再次委派。可以通过 send_message 与直接父 Agent 沟通。超出权限时，向父 Agent 报告限制。
"current_time": |-
  本次请求读取的时间：{{timestamp}}。时区：{{timezone}}。
"project_instructions": |-
  当前适用的项目指令。此完整快照替换此前的项目指令快照；子目录指令仅适用于对应目录。

  {{instructions}}
"project_instruction_file": |-
  <agent_instructions path="{{path}}">
  {{instructions}}
  </agent_instructions>
"project_instructions_cleared": |-
  当前没有适用的项目指令文件；此前的项目指令快照不再适用。
"skill_content": |-
  <skill_content name="{{name}}">
  <skill_resources>
  {{resources}}
  </skill_resources>
  <skill_instructions>
  {{instructions}}
  </skill_instructions>
  </skill_content>
"skill_provider": |-
  Resources for this skill are managed by provider "{{provider}}".
"skill_directory": |-
  Base directory for this skill: {{path}}
  Resolve relative paths mentioned by this skill against this directory before using file tools. Load referenced resources only as needed.
"skill_url": |-
  Base URL for this skill: {{url}}
  Resolve relative URLs against this base. Load referenced resources only as needed.
"skill_resources": |-
  Resources for this skill: {{description}}
"compaction_summary": |-
  This is an automatically generated checkpoint condensing an earlier span of the conversation. Treat the captured context as established background and continue directly from the messages that follow, without acknowledging this checkpoint.

  <compacted-summary>
  {{summary}}
  </compacted-summary>
"plan_entered": |-
  The user switched this session to plan mode.
"plan_exited": |-
  The user switched this session back to the default mode.
"mcp_server": |-
  MCP server "{{name}}" is connected. Resources declared: {{resources}}.
"mcp_instructions": |-
  Server instructions (literal text):
  {{instructions}}
"attached_file": |-
  Attached file (use read with this file_path): {{attachment}}
"attached_image": |-
  Attached image: {{attachment}}
"omitted_image": |-
  [image omitted to fit request image limits; file_path={{path}}, name={{name}}, normalized={{width}}x{{height}}px, media_type={{media_type}}, bytes={{bytes}}. Use read_image with this file_path to inspect its pixels again.]
