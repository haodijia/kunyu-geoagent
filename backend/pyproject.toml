[project]
name = "kunyu"
version = "0.1.0"
description = "Kunyu desktop backend"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12,<2",
    "anyio>=4,<5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.13,<3",
    "jsonschema>=4.26,<5",
    "mcp>=2,<3",
    "mcp-types>=2.3,<3",
    "numpy>=2,<3",
    "openai>=3.26,<4",
    "pillow>=12,<13",
    "platformdirs>=4.11.12",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic,openai]==2.54.0",
    "pyproj>=3.7,<4",
    "pyyaml>=6,<7",
    "rasterio>=1.4,<2",
    "reportlab>=4.4,<5",
    "shapely>=2.1,<3",
    "sqlalchemy>=2.0.54",
    "tzdata>=2026.5",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
