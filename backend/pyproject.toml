[project]
name = "kunyu"
version = "0.1.0"
description = "Kunyu desktop backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "platformdirs>=4.11.12",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
